[project]
name = "bur"
version = "0.7.0"
description = "Back up and restore dockerised Postgres databases, encrypted and pushed to Cloudflare R2"
readme = "README.md"
authors = [
    { name = "James Doyle", email = "jamesmddoyle@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.26.7",
]

[project.scripts]
bur = "bur:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.2",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["bur"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: needs docker and the age binary"]