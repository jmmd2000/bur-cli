[project]
name = "bur"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "James Doyle", email = "jamesmddoyle@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.26.7",
]

[project.scripts]
bur = "bur:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]
